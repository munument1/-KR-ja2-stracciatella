name: Import vanilla-compatible Korean MercEdt

on:
  push:
    branches:
      - korean-localization
    paths:
      - '.github/workflows/korean-import-legacy-mercedt.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stracciatella Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean-localization
          fetch-depth: 1

      - name: Checkout legacy JA2 1.13 Korean patch
        run: |
          git clone --depth 1 https://github.com/munument1/Jagged-Alliance2-korean.git "$RUNNER_TEMP/legacy-ja2-korean"

      - name: Import vanilla-compatible MercEdt files
        run: |
          python tools/korean/import_legacy_edt.py \
            --legacy-root "$RUNNER_TEMP/legacy-ja2-korean" \
            --trim-extra-records \
            --pad-empty-reference-tail

      - name: Verify imported EDT record alignment and runtime coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('assets/mods/korean-localization/data/MercEdt')
          files = sorted(root.glob('*.EDT'))
          names = {p.name for p in files}
          bad = [(p.name, p.stat().st_size) for p in files if p.stat().st_size % 480]
          if bad:
              raise SystemExit(f'EDT files not aligned to 480-byte records: {bad}')

          minimum_count = 68
          if len(files) < minimum_count:
              raise SystemExit(f'Expected at least {minimum_count} safe Korean MercEdt files, found {len(files)}')

          required = {f'{profile:03d}.EDT' for profile in range(51, 62)} | {'064.EDT'}
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f'Missing required IMP/RPC Korean MercEdt files: {missing}')

          expected_sizes = {
              **{f'{profile:03d}.EDT': 55200 for profile in range(51, 57)},
              **{f'{profile:03d}.EDT': 38400 for profile in range(57, 62)},
              '064.EDT': 38400,
          }
          wrong_sizes = [
              (name, (root / name).stat().st_size, size)
              for name, size in expected_sizes.items()
              if (root / name).stat().st_size != size
          ]
          if wrong_sizes:
              raise SystemExit(f'IMP/RPC EDT sizes differ from Stracciatella reference: {wrong_sizes}')

          optional_fixed = [name for name in ('040.EDT', '046.EDT') if name in names]
          print(
              f'Validated {len(files)} MercEdt files; IMP 051-056 and RPC 057-061/064 '
              f'are present. Empty-tail padded legacy files: {optional_fixed or "none"}.'
          )
          PY

      - name: Commit imported runtime dialogue
        run: |
          git add assets/mods/korean-localization/data/MercEdt
          if git diff --cached --quiet; then
            echo 'No MercEdt changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(korean): expand Stracciatella MercEdt translations'
          git push origin HEAD:korean-localization
