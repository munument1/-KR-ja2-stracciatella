name: Publish Korean v0.1.0-alpha.2

on:
  push:
    branches: [korean-localization]
    paths:
      - .github/workflows/publish-korean-v0.1.0-alpha.2.yml

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.1.0-alpha.2
      RELEASE_TARGET: 3403817ff5d45a3ab8e8531f79ef44d7567900ad
      BASE_RUN: '33607294939'
      MOD_RUN: '33769615307'
    steps:
      - name: Check whether release already exists
        id: existing
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download tested Windows build and latest Korean mod
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/base work/mod
          gh run download "$BASE_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name JA2-Stracciatella-Korean-Windows-Test \
            --dir work/base
          gh run download "$MOD_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name JA2-Stracciatella-Korean-Localization-Mod \
            --dir work/mod

      - name: Assemble release packages
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE_ZIP="$(find work/base/build-packages -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          test -n "$BASE_ZIP"

          mkdir -p work/stage
          unzip -q "$BASE_ZIP" -d work/stage
          ROOT="$(find work/stage -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -d "$ROOT"
          test -f "$ROOT/ja2.exe"
          test -f "$ROOT/ja2-launcher.exe"

          rm -rf "$ROOT/mods/korean-localization"
          mkdir -p "$ROOT/mods"
          cp -a work/mod/korean-localization "$ROOT/mods/"

          RELEASE_DIR="work/stage/JA2-Stracciatella-Korean-v0.1.0-alpha.2-Windows"
          mv "$ROOT" "$RELEASE_DIR"

          cat > "$RELEASE_DIR/KOREAN_RELEASE_INFO.txt" <<'EOF'
          JA2 Stracciatella Korean v0.1.0-alpha.2

          This package contains a Korean-enabled JA2 Stracciatella Windows build
          and the Korean Localization mod. Original Jagged Alliance 2 game data
          is NOT included and must be supplied by the user.

          Windows runtime baseline:
            d23e3db5222b62037616a0e34eb0003ca7036da1
          Korean localization source:
            3403817ff5d45a3ab8e8531f79ef44d7567900ad
          Korean generated runtime assets:
            8e76f33f8f434994fee7a665ba4d1be1f4ffd747
          EOF

          (
            cd work/stage
            zip -qr ../../JA2-Stracciatella-Korean-v0.1.0-alpha.2-Windows.zip \
              JA2-Stracciatella-Korean-v0.1.0-alpha.2-Windows
          )
          (
            cd work/mod
            zip -qr ../../JA2-Stracciatella-Korean-v0.1.0-alpha.2-Mod.zip \
              korean-localization
          )

          sha256sum \
            JA2-Stracciatella-Korean-v0.1.0-alpha.2-Windows.zip \
            JA2-Stracciatella-Korean-v0.1.0-alpha.2-Mod.zip \
            > SHA256SUMS.txt

      - name: Publish prerelease
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          ## JA2 Stracciatella 한국어판 v0.1.0-alpha.2

          한국어 폰트 가독성과 전술 화면의 작은 글씨 표시를 개선한 두 번째 알파 릴리즈입니다.

          ### 주요 변경 사항
          - 높이 8픽셀 이하의 JA2 한국어 폰트 슬롯을 **갈무리7** 기반으로 재생성
          - 전술/UI용 소형 폰트 슬롯은 **갈무리9** 기반으로 정리
          - `FONT12ARIAL`을 갈무리9로 전환하여 전술 화면 팝업/대화형 UI의 하단 잘림 가능성을 완화
          - 전술 하단 패널에서 사용하는 `BLOCKFONT2`, `COMPFONT` 등 8px 계열 폰트를 갈무리7로 갱신
          - 한국어 런타임 폰트 생성 파이프라인과 CI 자산 패키지 자동 연결 보강
          - 최신 한국어 BinaryData / MercEdt / NPCData 및 외부 문자열 자산 포함

          ### 현재 확인된 기능
          - New Game 화면 한국어 출력
          - Options 화면 한국어 출력
          - New Game 설정 후 실제 게임 진입
          - 게임 내 용병/NPC 대사 한국어 출력
          - A.I.M. 용병 전기 및 추가 정보 한국어 출력
          - 아이템/Bobby Ray 설명 한국어 출력
          - 한국어 폰트 및 메인 메뉴 자산 적용

          ### 파일
          - `JA2-Stracciatella-Korean-v0.1.0-alpha.2-Windows.zip`
            - 한국어 지원 Windows 실행 파일과 최신 Korean Localization 모드를 포함한 일반 사용자용 패키지
          - `JA2-Stracciatella-Korean-v0.1.0-alpha.2-Mod.zip`
            - 이미 한국어 지원 Windows 빌드를 사용하는 테스터를 위한 최신 모드 단독 패키지
          - `SHA256SUMS.txt`
            - 배포 파일 무결성 확인용 SHA-256

          ### Windows 설치
          1. Windows ZIP을 원하는 위치에 압축 해제합니다.
          2. `ja2-launcher.exe`에서 본인이 보유한 Jagged Alliance 2 원본 게임 데이터 위치를 지정합니다.
          3. `Korean Localization` 모드를 활성화합니다.
          4. 게임을 실행합니다.

          ### 이번 버전에서 확인해 주세요
          - 전술 화면 하단의 용병 이름/능력치/방어구/무게/위장 수치가 아래쪽에서 잘리지 않는지
          - 전술 팝업 및 작은 대화 상자의 한글 하단이 잘리지 않는지
          - 작은 글씨가 갈무리7 적용 후 이전보다 또렷하게 보이는지

          ### 주의
          - 이 릴리즈에는 Jagged Alliance 2 원본 게임 데이터가 포함되어 있지 않습니다.
          - 현재는 알파 버전이므로 일부 화면의 문구, 폰트 크기, 정렬은 추가 수정될 수 있습니다.
          - 한국어 런타임 지원은 아직 JA2 Stracciatella upstream 공식 빌드에 포함된 상태가 아닙니다.

          ### 기준
          - Korean Windows runtime: `d23e3db5222b62037616a0e34eb0003ca7036da1`
          - Korean Localization source: `3403817ff5d45a3ab8e8531f79ef44d7567900ad`
          - Generated Korean runtime assets: `8e76f33f8f434994fee7a665ba4d1be1f4ffd747`
          - Asset package workflow run: `33769615307`
          EOF

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET" \
            --title 'JA2 Stracciatella 한국어판 v0.1.0-alpha.2' \
            --notes-file release-notes.md \
            --prerelease \
            JA2-Stracciatella-Korean-v0.1.0-alpha.2-Windows.zip \
            JA2-Stracciatella-Korean-v0.1.0-alpha.2-Mod.zip \
            SHA256SUMS.txt

      - name: Report existing release
        if: steps.existing.outputs.exists == 'true'
        run: echo "Release $TAG already exists; nothing to do."
