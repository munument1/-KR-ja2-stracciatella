name: Korean translation coverage audit

on:
  push:
    branches:
      - korean-localization
    paths:
      - 'assets/externalized/strings/**'
      - 'assets/mods/korean-localization/**'
      - 'tools/korean/audit_translation_coverage.py'
      - '.github/workflows/korean-translation-audit.yml'
  pull_request:
    paths:
      - 'assets/externalized/strings/**'
      - 'assets/mods/korean-localization/**'
      - 'tools/korean/audit_translation_coverage.py'
      - '.github/workflows/korean-translation-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit Korean translation coverage
        run: |
          python tools/korean/audit_translation_coverage.py --json-out korean-translation-coverage.json
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korean-translation-coverage
          path: korean-translation-coverage.json
