name: GitHub CI

on:
  push:
    branches: [ master, nightly ]
    tags: [ '**' ]
  pull_request:
    types: [ opened, synchronize, reopened ]

concurrency:
  group: github-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-build:
    strategy:
      fail-fast: false
      matrix:
        cfg:
        - name: Linux
          os: ubuntu-22.04
          target: linux

        - name: Linux mingw64
          os: ubuntu-24.04
          target: linux-mingw64

        - name: Mac
          os: macos-latest
          target: mac

        - name: Android
          os: ubuntu-22.04
          target: android

    name: ${{ matrix.cfg.name }} ${{ github.ref }}
    runs-on: ${{ matrix.cfg.os }}
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      if: ${{ startsWith(matrix.cfg.os, 'ubuntu') }}
      with:
        tool-cache: false
        android: false

    - name: Context in env
      run: echo "$CONTEXT" > $GITHUB_WORKSPACE/src/sgp/BuildInfo.ts
      env:
        CONTEXT: ${{ toJson(github) }}

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0

    - name: Compiler cache (sccache)
      uses: Mozilla-Actions/sccache-action@v0.0.9
      with:
        version: v0.10.0

    - name: Cache Rust deps and build output
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: rust-${{ runner.os }}-${{ matrix.cfg.target }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          rust-${{ runner.os }}-${{ matrix.cfg.target }}-
          rust-${{ runner.os }}-

    - name: Run libsdl-org/setup-sdl@a966470e7d9b6a5c93eec3f08d5dac370325c860
      uses: libsdl-org/setup-sdl@a966470e7d9b6a5c93eec3f08d5dac370325c860
      if: ${{ matrix.cfg.target == 'linux' }}
      with:
        version: 2-latest
        version-sdl2_image: 2-latest

    - name: Set up JDK 18
      uses: actions/setup-java@v4
      if: ${{ matrix.cfg.target == 'android' }}
      with:
        distribution: 'temurin'
        java-version: 18

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      if: ${{ matrix.cfg.target == 'android' }}

    - name: Set up environment
      shell: bash
      run: |
        set -eu
        rustup update --no-self-update stable
        rustup component add clippy rustfmt
        if [[ "${{ matrix.cfg.target }}" == "linux-mingw64" ]]; then
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix cmake ninja-build
        fi
        if [[ "${{ matrix.cfg.target }}" == "android" ]]; then
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973'
        fi

    - name: Build and run tests
      shell: bash
      run: |
        set -eu
        case "${{ matrix.cfg.target }}" in
          linux)
            cmake -B build -G Ninja -DWITH_UNITTESTS=ON
            cmake --build build
            ctest --test-dir build --output-on-failure
            ;;
          linux-mingw64)
            cmake -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw64.cmake -DWITH_UNITTESTS=ON
            cmake --build build
            ;;
          mac)
            cmake -B build -DWITH_UNITTESTS=ON
            cmake --build build
            ctest --test-dir build --output-on-failure
            ;;
          android)
            cd android
            ./gradlew assembleDebug
            ;;
        esac

    - name: Publish packages
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      shell: bash
      run: |
        echo 'Package publishing is handled by release workflows.'

    - name: Upload android cmake logs
      if: ${{ failure() && matrix.cfg.target == 'android' }}
      uses: actions/upload-artifact@v4
      with:
        name: android-cmake-logs
        path: android/app/.cxx/**/CMakeFiles/CMakeOutput.log
        if-no-files-found: ignore

    - name: Collect artifacts
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      shell: bash
      run: |
        echo 'Artifact collection is handled by release workflows.'

    - name: Upload artifacts
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      uses: actions/upload-artifact@v4
      with:
        name: ci-${{ matrix.cfg.target }}
        path: build
        if-no-files-found: ignore

  lint:
    strategy:
      fail-fast: false
      matrix:
        cfg:
        - name: linux
          os: ubuntu-latest
        - name: windows
          os: windows-latest
        - name: mac
          os: macos-latest
    name: lint ${{ matrix.cfg.name }} ${{ github.ref }}
    runs-on: ${{ matrix.cfg.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0

    - name: Install rustup
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Run cargo fmt
      run: cargo fmt --all -- --check

    - name: Run cargo clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
