name: Repair Korean EDT padding residue

on:
  push:
    branches:
      - korean-localization
    paths:
      - 'tools/korean/sanitize_edt_padding.py'
      - '.github/workflows/repair-korean-edt-padding.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - name: Checkout Korean localization branch
        uses: actions/checkout@v4
        with:
          ref: korean-localization

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clean Korean-only EDT padding residue
        run: python tools/korean/sanitize_edt_padding.py --expect-changed-fields 15

      - name: Commit repaired EDT files
        shell: pwsh
        run: |
          $changed = @(git diff --name-only -- assets/mods/korean-localization/data)
          if ($changed.Count -eq 0) {
            throw 'Expected EDT repairs, but no Korean EDT files changed.'
          }

          Write-Host 'Changed EDT files:'
          $changed | ForEach-Object { Write-Host "  $_" }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/mods/korean-localization/data
          git commit -m 'Clean Korean EDT padding residue'
          git push origin HEAD:korean-localization
