name: Apply Korean UI translation batch

on:
  push:
    branches:
      - korean-localization
    paths:
      - 'tools/korean/apply_ui_translation_batch_*.py'
      - 'tools/korean/apply_korean_stat_message_patch.py'
      - 'tools/korean/validate_localization_strings.py'
      - 'tools/korean/audit_translation_coverage.py'
      - '.github/workflows/korean-apply-ui-batch.yml'

concurrency:
  group: korean-ui-translation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean localization branch
        uses: actions/checkout@v4
        with:
          ref: korean-localization
          fetch-depth: 1

      - name: Apply Korean stat-message source patch
        run: |
          if [ -f tools/korean/apply_korean_stat_message_patch.py ]; then
            python tools/korean/apply_korean_stat_message_patch.py
          fi

      - name: Apply UI translation batches
        run: |
          for batch in tools/korean/apply_ui_translation_batch_*.py; do
            echo "Applying $batch"
            python "$batch"
          done

      - name: Validate localization structure and placeholders
        run: |
          python tools/korean/validate_localization_strings.py
          python tools/korean/audit_translation_coverage.py --json-out korean-translation-coverage.json

      - name: Commit translated UI strings and Korean stat formatting
        run: |
          git add \
            assets/externalized/strings/translation-kor.json \
            src/game/GameRes.h \
            src/game/GameRes.cc \
            src/game/Tactical/Campaign.cc
          if git diff --cached --quiet; then
            echo 'No Korean localization changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(korean): apply reviewed Stracciatella UI batches'
          git push origin HEAD:korean-localization
